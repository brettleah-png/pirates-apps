# Netlify settings for the bookings app.
#
# In the Netlify UI, leave the base directory as the repo root and set the
# package directory to apps/bookings, so pnpm installs the whole workspace.
# Paths here are relative to the repo root. Node's version comes from .nvmrc.

[build]
  command = "pnpm build:bookings"
  publish = "apps/bookings/dist"
  # Skip the build unless something the bookings app depends on changed.
  # git diff --quiet exits 0 when nothing changed, which tells Netlify to skip.
  # The lockfile changes with any app's dependencies, so those still build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/bookings package.json pnpm-lock.yaml pnpm-workspace.yaml .nvmrc"
