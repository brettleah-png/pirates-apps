<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Club Calendar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1100px; /* wider layout for desktop */
        margin: 20px auto;
        padding: 0 15px;
      }
      #calendar {
        max-width: 100%;
        margin: 0 auto 20px auto;
      }
      #legend {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        border-top: 1px solid #ddd;
        padding-top: 12px;
        justify-content: flex-start; /* row layout on desktop */
      }
      .legend-item {
        display: flex;
        align-items: center;
        font-size: 15px;
        cursor: pointer;
        user-select: none;
      }
      .legend-color {
        width: 14px;
        height: 14px;
        margin-right: 6px;
        border: 1px solid #444;
        border-radius: 3px;
      }
      .legend-item.inactive {
        opacity: 0.5;
        color: #888;
      }

      /* ✅ Mobile responsiveness */
      @media (max-width: 600px) {
        body {
          padding: 10px;
        }
        #legend {
          flex-direction: column;
          gap: 6px;
        }
        .fc-toolbar.fc-header-toolbar {
          flex-wrap: wrap;
          justify-content: center;
          text-align: center;
        }
        .fc-toolbar-chunk {
          margin-bottom: 6px;
        }
        .legend-item {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Club Calendar</h1>
    <div id="calendar"></div>
    <div id="legend"></div>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const calendarEl = document.getElementById("calendar");
        const legendEl = document.getElementById("legend");

        try {
          const res = await fetch("feeds.json?t=" + new Date().getTime());
          const feeds = await res.json();

          const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: "dayGridMonth",
            displayEventEnd: false,
            timeZone: "UTC", // ✅ Force GMT/UTC timezone
            headerToolbar: {
              left: "prev,next today",
              center: "title",
              right: "dayGridMonth,listWeek,listDay",
            },
            eventTimeFormat: {
              // ✅ Only show start time
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            },
            views: {
              listWeek: { buttonText: "Week List" },
              listDay: { buttonText: "Day List" },
            },
            height: "auto",
          });
          calendar.render();

          // ✅ Fix squashed month view by forcing a resize after render
          setTimeout(() => {
            calendar.updateSize();
          }, 100);

          const sourceMap = {};

          feeds.forEach((feed) => {
            // Build legend
            const item = document.createElement("div");
            item.className = "legend-item";

            const colorBox = document.createElement("div");
            colorBox.className = "legend-color";
            colorBox.style.backgroundColor = feed.color;

            const label = document.createElement("span");
            label.textContent = feed.name || feed.url;

            item.appendChild(colorBox);
            item.appendChild(label);
            legendEl.appendChild(item);

            // Add feed source
            const source = {
              id: feed.name,
              url: "ics-to-json.php?url=" + encodeURIComponent(feed.url),
              color: feed.color,
              textColor: "#fff",
            };
            calendar.addEventSource(source);
            sourceMap[feed.name] = source;

            // Toggle show/hide on click
            item.addEventListener("click", () => {
              if (item.classList.contains("inactive")) {
                calendar.addEventSource(sourceMap[feed.name]);
                item.classList.remove("inactive");
              } else {
                const evSource = calendar.getEventSourceById(feed.name);
                if (evSource) evSource.remove();
                item.classList.add("inactive");
              }
            });
          });
        } catch (e) {
          console.error("Error loading feeds:", e);
          calendarEl.innerHTML =
            "<p style='color:red;'>Failed to load calendar feeds.</p>";
        }
      });
    </script>
  </body>
</html>
