<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Feed Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      line-height: 1.6;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }
    th, td {
      padding: 8px;
      border: 1px solid #ddd;
    }
    input[type="url"], input[type="text"] {
      width: 95%;
    }
    button {
      padding: 6px 12px;
      margin: 5px;
      font-size: 14px;
      cursor: pointer;
    }
    .status {
      margin-top: 15px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Manage Calendar Feeds</h1>
  <p>Add one or more feeds. Each has a name, a URL, and a color for display.</p>

  <table id="feedTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Feed URL</th>
        <th>Color</th>
        <th>Remove</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button id="addFeedBtn">➕ Add Feed</button>
  <button id="saveBtn">💾 Save Feeds</button>
  <div class="status" id="status"></div>

  <script>
    const feedTableBody = document.querySelector('#feedTable tbody');
    const status = document.getElementById('status');

    function createRow(feed = { name: "", url: "", color: "#3788d8" }) {
      const tr = document.createElement('tr');

      // Name field
      const nameTd = document.createElement('td');
      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.value = feed.name;
      nameTd.appendChild(nameInput);

      // URL field
      const urlTd = document.createElement('td');
      const urlInput = document.createElement('input');
      urlInput.type = 'url';
      urlInput.value = feed.url;
      urlTd.appendChild(urlInput);

      // Color field
      const colorTd = document.createElement('td');
      const colorInput = document.createElement('input');
      colorInput.type = 'color';
      colorInput.value = feed.color || "#3788d8";
      colorTd.appendChild(colorInput);

      // Remove button
      const removeTd = document.createElement('td');
      const removeBtn = document.createElement('button');
      removeBtn.textContent = "❌";
      removeBtn.addEventListener('click', () => tr.remove());
      removeTd.appendChild(removeBtn);

      tr.appendChild(nameTd);
      tr.appendChild(urlTd);
      tr.appendChild(colorTd);
      tr.appendChild(removeTd);

      feedTableBody.appendChild(tr);
    }

    // Load saved feeds from feeds.json
    async function loadFeeds() {
      try {
        const res = await fetch('feeds.json?nocache=' + Date.now());
        if (!res.ok) throw new Error("Failed to load feeds.json");
        return await res.json();
      } catch (err) {
        console.error("Error loading feeds.json", err);
        return [];
      }
    }

    // Save feeds to server via save-feeds.php
    async function saveFeeds(feeds) {
      try {
        const res = await fetch('save-feeds.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(feeds, null, 2)
        });
        return await res.json();
      } catch (err) {
        console.error("Error saving feeds.json", err);
        return { success: false, error: err.message };
      }
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', async () => {
      const savedFeeds = await loadFeeds();
      savedFeeds.forEach(feed => createRow(feed));
    });

    // Add new feed
    document.getElementById('addFeedBtn').addEventListener('click', () => {
      createRow();
    });

    // Save feeds
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const feeds = [];
      feedTableBody.querySelectorAll('tr').forEach(tr => {
        const name = tr.querySelector('input[type="text"]').value.trim();
        const url = tr.querySelector('input[type="url"]').value.trim();
        const color = tr.querySelector('input[type="color"]').value;
        if (url) feeds.push({ name, url, color });
      });

      const result = await saveFeeds(feeds);
      if (result.success) {
        status.textContent = "✅ Feeds saved successfully!";
      } else {
        status.textContent = "❌ Failed to save feeds.";
      }
      setTimeout(() => { status.textContent = ""; }, 3000);
    });
  </script>
</body>
</html>
